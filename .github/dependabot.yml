version: 2
updates:
  - package-ecosystem: "bundler"
    versioning-strategy: "lockfile-only"
    directory: "/"
    allow:
      - dependency-type: "all"
    groups:
      rails:
        applies-to: version-updates
        patterns:
          - "rails"
      rubocop:
        applies-to: version-updates
        patterns:
          - "rubocop*"
      dependencies:
        applies-to: version-updates
        exclude-patterns:
          - "actioncable"
          - "actionmailbox"
          - "actionmailer"
          - "actionpack"
          - "actiontext"
          - "actionview"
          - "activejob"
          - "activemodel"
          - "activerecord"
          - "activestorage"
          - "activesupport"
          - "railties"
          - "rails"
          - "rubocop*"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    versioning-strategy: "lockfile-only"
    directory: "/"
    groups:
      dependencies:
        applies-to: version-updates
        patterns:
          - "*"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      dependencies:
        applies-to: version-updates
        patterns:
          - "*"
    schedule:
      interval: "weekly"
