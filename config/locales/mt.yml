  site:
    about:
      heading_html: Kontributuri t'%{copyright}OpenStreetMap %{br}
      used_by_html: '%{name} jipprovdi data tal-mapep għal eluf ta'' siti, appi mobbli,
        u apparati tal-ħardwer'
      lede_text: |-
        OpenStreetMap hija mibnija minn komunità ta' mappiera li jikkontribwixxu u jżommu data
        dwar toroq, mogħdijiet, kaffejiet, stazzjonijiet tal-ferrovija, u ħafna aktar, madwar id-dinja kollha.
    about_section:
      local_knowledge_title: Għarfien Lokali
      local_knowledge_html: OpenStreetMap jenfasizza l-għarfien lokali. Il-kontributuri
        jużaw stampi arjali, GPSiet, u mapep tal-qasam tat-teknoloġija bażika biex
        jivverifikaw li OSM huwa preċiż u aġġornat.
      community_driven_title: Komunitarja
      community_driven_1_html: |-
        Il-komunità t'OpenStreetMap hija diversa, passjonata, u qed tikber kuljum.
        Il-kontributuri tagħna jinkludu mappiera entużjasti, professjonisti tal-GIS, inġiniera
        li jmexxu s-servituri t'OSM, umanitarji li jimmappaw żoni milquta minn diżastri,
        u ħafna aktar.
        Biex titgħallem aktar dwar il-komunità, ara l-%{osm_blog_link},
        %{user_diaries_link}, %{community_blogs_link}, u s-sit ta'
        %{osm_foundation_link}.
      community_driven_osm_blog: Blogg t'OpenStreetMap
      community_driven_user_diaries: Djarji tal-Utenti
      community_driven_community_blogs: bloggijiet komunitarji
      community_driven_osm_foundation: Fondazzjoni OSM
      open_data_title: Data Miftuħa
      open_data_1_html: |-
        OpenStreetMap huwa ta' %{open_data}: tista' tużah għal kwalunkwe skop
         jekk tagħti kreditu lil OpenStreetMap u l-kontributuri tiegħu. Jekk tbiddel jew
         tibni fuq id-data b'ċerti modi, tista' tqassam ir-riżultat biss
         taħt l-istess liċenzja. Ara l-%{copyright_license_link} għal aktar dettalji.
      open_data_open_data: data miftuħa
      open_data_copyright_license: Paġna tal-Jeddijiet tal-Awtur u l-Liċenzja
      legal_title: Legali
      legal_1_1_html: |-
        Das-sit u ħafna servizzi oħra relatati huma formalment imħaddma mill-
        %{openstreetmap_foundation_link} (OSMF)
        f'isem il-komunità. L-użu tas-servizzi kollha mħaddma mill-OSMF huwa soġġett
        għat-%{terms_of_use_link} tagħna, %{aup_link} u l-%{privacy_policy_link} tagħna.
      legal_1_1_openstreetmap_foundation: Fondazzjoni OpenStreetMap
      legal_1_1_terms_of_use: Termini tal-Użu
      legal_1_1_aup: Politiki ta' Użu Aċċettabbli
      legal_1_1_privacy_policy: Politika tal-Privatezza
      legal_1_2_html: Jekk tixtieq tuża mapep jew data ta' OpenStreetMap, jekk jogħġbok
        ara li tagħti l-attribuzzjoni lil OpenStreetMap—irreferi għal %{attribution_guidelines_link}
        għal aktar informazzjoni.
      legal_attribution_guidelines_title: Linji Gwida dwar l-Attribuzzjoni
      legal_1_3_html: Speċifikament għall-użu ta' ritratt minn OpenStreetMap fil-ktieb,
        pubblikazzjoni, film jew programm televiżiv tiegħek, m'għandekx bżonn titlob
        permess peress li d-data f'OpenStreetMap hija miftuħa għall-użu minn kulħadd.
        Irreferi għall-%{attribution_guidelines_link} u ara eżempji eżistenti fil-%{attribution_example_film}
        u %{attribution_example_tv}.
      legal_attribution_example_film_title: Film
      legal_attribution_example_tv_title: Televiżjoni
      legal_2_1_html: |-
        Jekk jogħġbok %{contact_the_osmf_link}
         għal kwalunkwe mistoqsija oħra dwar liċenzjar, jeddijiet tal-awtur jew mistoqsijiet legali oħra.
      legal_2_1_contact_the_osmf: ikkuntattja l-OSMF
      legal_2_2_html: OpenStreetMap, il-logo tal-lenti u l-Istat tal-Mappa huma %{registered_trademarks_link}.
      legal_2_2_registered_trademarks: marki kummerċjali rreġistrati tal-OSMF
      partners_title: Imsieħba
    copyright:
      title: Jeddijiet tal-Awtur u Liċenzja
      foreign:
        title: Fuq din it-traduzzjoni
        html: F'każ ta' kunflitt bejn din il-paġna tradotta u %{english_original_link},
