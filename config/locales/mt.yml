          Fondazzjoni OpenStreetMap. Jekk għandek domanda dwar l-użu tiegħek ta' dawn il-marki, jekk jogħġbok ara l-
          %{trademark_policy_link} tagħna.
        trademarks_1_1_trademark_policy: Politika tal-Marki Kummerċjali
        services_title_html: Servizzi addizzjonali
        services_1_html: |-
          Għalkemm OpenStreetMap hija data miftuħa, ma nistgħux nipprovdu API tal-mapep jew madum tal-mapep bla ħlas lil partijiet terzi.
          Ara l-%{api_usage_policy_link}, il-%{tile_usage_policy_link} u l-%{nominatim_usage_policy_link} tagħna.
        services_1_api_usage_policy: Politika tal-Użu tal-API
