      legal_babble:
        lead_1_html: |-
          OpenStreetMap jipprovdi data miftuħa tal-mapep għal eluf ta’ siti, appi mobbli, u apparati tal-ħardwer.
          OpenStreetMap huwa mibni minn komunità ta’ nies bħalek li jikkontribwixxu u jżommu dejta tal-immappjar
          dwar toroq, mogħdijiet, kaffejiet, stazzjonijiet tal-ferrovija, u ħafna aktar, madwar id-dinja kollha.
        lead_2_html: |-
          %{learn_more_about_osm_link} u %{get_started_mapping_link}!
          Tista' taqra aktar fuq il-%{osm_blog_link}, u tabbona għal %{weeklyosm_link}.
          Sib mappiera oħra fil-%{osm_community_link} lokali tiegħek.
          Appoġġja l-proġett billi tingħaqad mal-%{osm_foundation_link} u %{making_donation_link}.
        lead_2_learn_more_about_osm: Tgħallem aktar dwar OpenStreetMap
        lead_2_get_started_mapping: ibda l-immappjar
        lead_2_osm_blog: Blogg t'OpenStreetMap
        lead_2_osm_community: Komunità tal-OSM
        lead_2_osm_foundation: Fondazzjoni OSM
        lead_2_making_donation: tagħti donazzjoni
        licensing_title: Liċenzjar tal-OpenStreetMap
        licensing_1_html: |-
          OpenStreetMap hija dejta %{open}, liċenzjata taħt l-
          %{odc_odbl_link} (ODbL) mill-%{osm_foundation_link} (OSMF). Fil-qosor:
        licensing_1_open: miftuħ
