        licensing_1_osm_foundation: Fondazzjoni OpenStreetMap
        licensing_2_html: Tista' tikkopja, tiddistribwixxi, tittrażmetti u tadatta
          d-data tagħna, sakemm tagħti kreditu lil OpenStreetMap u lill-kontributuri
          tagħha. Jekk tbiddel jew tibni fuq id-data tagħna, tista' tiddistribwixxi
          r-riżultat biss taħt l-istess liċenzja. Il-%{legal_code_link} jispjega l-jeddijiet
          u r-responsabbiltajiet tiegħek.
        licensing_2_legal_code: kodiċi legali sħiħa fuq Komuni tad-Data Miftuħa
