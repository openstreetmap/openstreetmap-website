    welcome:
      title: خوش آمدید!
      introduction: به OpenStreetMap، نقشهٔ آزاد و قابل ویرایش جهان، خوش آمدید. اکنون
        که نام‌نویسی‌تان کامل شده، می‌توانید یکراست نقشه‌کشی را آغاز کنید. این راهنمای
        سریع دربارهٔ مهم‌ترین چیزهایی است که به دانستنشان نیاز دارید.
      whats_on_the_map:
        title: چیزهایی که روی نقشه می‌آید
        on_the_map_html: اوپن‌استریت‌مپ جایی برای ترسیم چیزهایی است که %{real_and_current}
          هستند؛ شامل میلیون‌ها ساختمان، جاده و جزئیات دیگر مکان‌هاست. می‌توانید هر
          عارضهٔ واقعیِ موردعلاقه‌تان را روی نقشه ثبت کنید.
        real_and_current: واقعی و موجود
        off_the_map_html: آنچه در این نقشه %{doesnt}، داده‌های سلیقه‌ای مانند امتیازدهی،
          عوارض تاریخی یا فرضی، و داده‌های برگرفته از منابع دارای حق نشر است. مگر
          اینکه مجوز ویژه داشته باشید، از نقشه‌های آنلاین یا کاغذی کپی نکنید.
        doesnt: جایی ندارد
      basic_terms:
        title: اصطلاحات پایهٔ نقشه‌کشی
        paragraph_1: OpenStreetMap اصطلاحات ویژهٔ خودش را دارد. در اینجا چند کلیدواژهٔ
          مفید ذکر شده است.
        an_editor_html: '%{editor} برنامه یا وبگاهی است که می‌توانید با آن نقشه را
          ویرایش کنید.'
        a_node_html: '%{node} نقطه‌ای روی نقشه است، مانند یک رستوران یا درخت.'
        a_way_html: '%{way} یک خط یا محدوده است، مانند جاده، جویبار، دریاچه یا ساختمان.'
        a_tag_html: '%{tag} داده‌ای دربارهٔ گره یا راه است، مانند نام رستوران یا محدودیت
          سرعت جاده.'
        editor: ویرایشگر
        node: گره
        way: راه
        tag: برچسب
      rules:
        title: قوانین!
        para_1_html: اوپن‌استریت‌مپ قواعد رسمی اندکی دارد، اما انتظار داریم همهٔ مشارکت‌کنندگان
          با اجتماع همکاری و ارتباط داشته باشند. اگر قصد انجام فعالیتی غیر از ویرایش
          دستی دارید، لطفاً رهنمودهای %{imports_link} و %{automated_edits_link} را
          بخوانید و رعایت کنید.
        imports: درون‌ریزی‌ها
        automated_edits: ویرایش‌های خودکار
      start_mapping: نقشه‌کشی را آغاز کنید
      continue_authorization: ادامهٔ مجوزدهی
    add_a_note:
      title: زمانی برای ویرایش ندارید؟ یادداشت اضافه کنید!
      para_1: |-
        اگر فقط می‌خواهید چیز کوچکی را درست کنید و وقت  کافی برای نام‌نویسی و یادگیری ویرایش ندارید، خیلی راحت
        یک یادداشت بنویسید.
      para_2_html: کافی است روی %{note_icon} یا همین نماد در %{map_link} کلیک کنید.
        نشانگری به نقشه افزوده می‌شود که می‌توانید با کشیدن جابه‌جایش کنید. پیام خود
        را اضافه و ذخیره کنید تا دیگر نقشه‌برداران بررسی کنند.
      the_map: نقشه
    communities:
      title: جوامع
      lede_text: |-
        مردم از سراسر جهان در OpenStreetMap مشارکت می‌کنند یا از آن استفاده می‌کنند. در حالی که بسیاری به صورت فردی مشارکت می‌کنند، برخی دیگر جوامعی را تشکیل داده‌اند.

        این گروه‌ها در اندازه‌های مختلفی هستند و نماینده جغرافیاهایی از شهرهای کوچک تا مناطق بزرگ چند کشوری می‌باشند. آنها همچنین می‌توانند رسمی یا غیررسمی باشند.
      local_chapters:
        title: شاخه‌های محلی
        about_text: شاخه‌های محلی، گروه‌هایی در سطح کشور یا منطقه هستند که رسماً اقدام
          به تأسیس نهادهای حقوقی غیرانتفاعی کرده‌اند. آن‌ها نماینده نقشه و نقشه‌برداران
          منطقه در تعامل با دولت محلی، کسب‌وکارها و رسانه‌ها هستند. آن‌ها همچنین با
          بنیاد اوپن‌استریت‌مپ (OSMF) همکاری می‌کنند که به آن‌ها پیوندی با نهاد قانونی
          و ناظر بر حق نشر می‌دهد.
        list_text: 'جوامع زیر رسماً به عنوان شعب محلی تأسیس شده‌اند:'
      other_groups:
        title: سایر گروه‌ها
        other_groups_html: نیازی به تشکیل رسمی یک گروه به اندازه‌ی شعب محلی نیست.
          در واقع بسیاری از گروه‌ها به عنوان یک گردهمایی غیررسمی از مردم یا به عنوان
          یک گروه اجتماعی با موفقیت بسیار زیادی وجود دارند. هر کسی می‌تواند این گروه‌ها
          را تشکیل دهد یا به آنها بپیوندد. برای اطلاعات بیشتر به %{communities_wiki_link}
          مراجعه کنید.
        communities_wiki: صفحهٔ ویکی جوامع
