version: 0.10.3

linter:
  rules:
    a11y-no-aria-label-misuse:
      enabled: true
    a11y-svg-has-accessible-text:
      enabled: true
    actionview-no-silent-helper:
      enabled: false
    erb-no-unused-expressions:
      enabled: false
    erb-strict-locals-required:
      enabled: true
    html-no-space-in-tag:
      enabled: true
    html-no-title-attribute:
      enabled: true
    html-require-script-nonce:
      enabled: false
